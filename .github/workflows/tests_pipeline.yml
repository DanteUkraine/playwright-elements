name: TestsPipeline
on:
  push:
    branches:
      - 'experiment/**'
  pull_request:
    branches:
      - main
concurrency:
  group: TestsPipeline
  cancel-in-progress: true
jobs:

  test:
    strategy:
      matrix:
        platform: [ ubuntu-latest, macos-latest, windows-latest ]
        node: [ '22', '24', '26']
    name: ${{ matrix.platform }} - Node ${{ matrix.node }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        run: npm ci
      - name: Install browsers
        run: npm run install:browsers
      - name: Build
        run: npm run build
      - name: Run CI guard checks
        run: npm run ci:check-all
        timeout-minutes: 5
      - name: Run type checks
        run: npm run test:types
        timeout-minutes: 10
      - name: Run Unit tests
        run: npm run test:unit
        timeout-minutes: 15
      - name: Run test ids package tests
        run: npm run test:unit --workspace @playwright-elements/testids
        timeout-minutes: 5
      - name: Run integration tests
        run: npm run integration:test
        timeout-minutes: 15
      - run: echo "🍏 This job's status is ${{ job.status }}."

  test-bun:
    strategy:
      matrix:
        platform: [ ubuntu-latest, macos-latest, windows-latest ]
    name: ${{ matrix.platform }} - Bun 1.4.4
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install
      - name: Install browsers
        run: npm run install:browsers
      - name: Build
        run: bun run build
      - name: Run CI guard checks
        run: bun run ci:check-all
        timeout-minutes: 5
      - name: Run type checks
        run: bun run test:types
        timeout-minutes: 10
      - name: Run Unit tests
        run: bun run test:unit
        timeout-minutes: 15
      - name: Run test ids package tests
        run: bun run --filter=@playwright-elements/testids test:unit
        timeout-minutes: 5
      - name: Run integration tests
        run: bun run integration:test
        timeout-minutes: 15
      - run: echo "🍏 This job's status is ${{ job.status }}."
