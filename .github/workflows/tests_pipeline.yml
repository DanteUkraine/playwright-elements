name: TestsPipeline
on:
  push:
    branches:
      - 'experiment/**'
  pull_request:
    branches:
      - main
concurrency:
  group: TestsPipeline
  cancel-in-progress: true
jobs:

  test:
    strategy:
      matrix:
        platform: [ ubuntu-latest, macos-latest, windows-latest ]
        node: [ '20', '22', '24', '26']
    name: ${{ matrix.platform }} - Node ${{ matrix.node }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        run: npm ci
      - name: Install browsers
        run: npm run install:browsers
      - name: Build
        run: npm run build
        timeout-minutes: 5
      - name: Run type tests
        run: npm run test:types
        timeout-minutes: 5
      - name: Run CI guard checks
        run: npm run ci:check-all
        timeout-minutes: 5
      - name: Run regression tests
        run: npm run test:regression
        timeout-minutes: 5
      - name: Run type runtime tests
        run: npm run test:types-runtime
        timeout-minutes: 5
      - name: Run selector tests
        run: npm run test:selectors
        timeout-minutes: 5
      - name: Run validation tests
        run: npm run test:validation
        timeout-minutes: 5
      - name: Run collision tests
        run: npm run test:collisions
        timeout-minutes: 5
      - name: Run existing unit tests
        run: npm run test:unit
        timeout-minutes: 10
      - name: Run integration tests
        run: npm run integration:test
        timeout-minutes: 10
      - run: echo "🍏 This job's status is ${{ job.status }}."
