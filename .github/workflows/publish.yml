name: Publish Package to npm
on:
  release:
    types: [created]
permissions:
  id-token: write
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Setup .npmrc file to publish to npm
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Run npm ci
        run: npm ci

      - name: Determine which package to publish
        id: determine
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Release tag: $TAG"
          if [[ "$TAG" == testids-v* ]]; then
            echo "package=testids" >> "$GITHUB_OUTPUT"
            echo "dir=packages/testids" >> "$GITHUB_OUTPUT"
            PKG_VERSION=$(node -p "require('./packages/testids/package.json').version")
          else
            echo "package=framework" >> "$GITHUB_OUTPUT"
            echo "dir=." >> "$GITHUB_OUTPUT"
            PKG_VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

          # Determine dist-tag (rc, alpha, beta, next, or latest)
          if [[ $PKG_VERSION == *-rc* ]]; then
            echo "dist-tag=rc" >> "$GITHUB_OUTPUT"
          elif [[ $PKG_VERSION == *-alpha* ]]; then
            echo "dist-tag=alpha" >> "$GITHUB_OUTPUT"
          elif [[ $PKG_VERSION == *-beta* ]]; then
            echo "dist-tag=beta" >> "$GITHUB_OUTPUT"
          elif [[ $PKG_VERSION == *-next* ]]; then
            echo "dist-tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "dist-tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Replace md links with github pages links
        if: steps.determine.outputs.package == 'framework'
        run: npm run modify:readme

      - name: Build
        run: npm run build

      - name: Publish
        run: |
          DIR="${{ steps.determine.outputs.dir }}"
          TAG="${{ steps.determine.outputs.dist-tag }}"
          echo "Publishing ${{ steps.determine.outputs.package }} from $DIR with tag $TAG"
          cd "$DIR"
          if [ "$TAG" != "latest" ]; then
            npm publish --tag "$TAG"
          else
            npm publish
          fi